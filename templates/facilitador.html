<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel do Facilitador</title>
<style>
  body{margin:0;background:#0b0f14;color:#d6e2f0;font-family:Consolas,monospace;padding:24px}
  h1{color:#3b9eff;margin-top:0}
  .barra{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  button,a.btn{font-family:inherit;font-size:15px;padding:10px 18px;border:none;border-radius:6px;cursor:pointer;color:#fff;text-decoration:none}
  .amarelo{background:#f5b942;color:#222}.vermelho{background:#ff4d4f}.azul{background:#3b9eff}
  table{width:100%;border-collapse:collapse;background:#121923}
  th,td{padding:10px 14px;border-bottom:1px solid #1f2b3a;text-align:left}th{color:#f5b942}
  .flag{background:#1f2b3a;border-radius:4px;padding:2px 6px;margin-right:4px;font-size:12px}
</style>
</head>
<body>
<h1>Painel do Facilitador</h1>
<div class="barra">
  <button class="amarelo" onclick="if(confirm('Encerrar o exercício de todos?'))acao('/api/encerrar')">&#9632; Encerrar todos</button>
  <button class="vermelho" onclick="if(confirm('Apagar todos os participantes?'))acao('/api/resetar')">&#8635; Resetar</button>
  <a class="btn azul" href="/api/csv">&#8595; Baixar CSV</a>
</div>
<table>
  <thead><tr><th>Participante</th><th>Fase</th><th>Ações</th><th>Pontos</th><th>Flags</th><th>Final</th></tr></thead>
  <tbody id="corpo"></tbody>
</table>
<script>
  const esc=s=>{const d=document.createElement("div");d.textContent=s;return d.innerHTML};
  async function acao(u){await fetch(u,{method:"POST"});atualizar()}
  async function atualizar(){
    try{
      const d=await (await fetch("/api/painel")).json();
      document.getElementById("corpo").innerHTML=d.participantes.sort((a,b)=>b.pontos-a.pontos).map(p=>`
        <tr><td>${esc(p.nome)}</td><td>${p.finalizado?"concluído":esc(p.fase)}</td><td>${p.acoes}</td>
        <td><b>${p.pontos}</b></td>
        <td>${p.flags.map(f=>`<span class="flag">${esc(f)}</span>`).join("")}</td>
        <td>${esc(p.final)}</td></tr>`).join("");
    }catch(e){}
  }
  setInterval(atualizar,2000);atualizar();
</script>
</body>
</html>
