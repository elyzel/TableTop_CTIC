<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <div id="caso"></div>
  <script src="{{ url_for('static', filename='relatorio_final.js') }}"></script>

  <script>
    iniciarInterrogatorio(
      document.getElementById('caso'),
      {
        pid: localStorage.getItem('tt_pid'),

        onAtividadeConcluida(resultado) {
          document.dispatchEvent(
            new CustomEvent(
              'tabletop:atividadeConcluida',
              {detail: resultado}
            )
          );
        }
      }
    );
  </script>
